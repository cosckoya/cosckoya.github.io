[project]
name = "cosckoya.github.io"
version = "0.1.0"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.codespell]
skip = "venv,site,.git,*.png,*.jpg,*.svg,*.ico,requirements-lock.txt"
ignore-words-list = "ciso,cosckoya,aks,ot"
