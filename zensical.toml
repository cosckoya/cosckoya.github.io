site_name = "It's dangerous to go alone!"
site_url = "https://cosckoya.github.io"
site_description = "Cosckoya's Tech Toolbox"
site_author = "cosckoya"
copyright = "Copyright &copy; 2026 цосцкоыа"

repo_url = "https://github.com/cosckoya/cosckoya.github.io"
edit_uri = ""

docs_dir = "docs"
site_dir = "site"
dev_addr = "127.0.0.1:8000"

nav = [
  { "API" = [
    { "Python API Development" = "api/python-api.tool.md" },
    { "Spectral" = "api/spectral.tool.md" },
  ]},
  { "DevSecOps" = [
    "devsecops/index.md",
    { "Terraform" = [
      { "Terraform" = "devsecops/terraform.tool.md" },
      { "tflint" = "devsecops/tflint.tool.md" },
      { "checkov" = "devsecops/checkov.tool.md" },
      { "terraform-docs" = "devsecops/terraform-docs.tool.md" },
    ]},
  ]},
  { "Awesome" = [
    { "Sword & Sorcery" = "awesome/sword-and-sorcery.md" },
  ]},
  { "Bestiary" = [
    "awesome/bestiary/index.md",
    { "World Mythology" = [
      { "Classical Mythology" = "awesome/bestiary/classical.bestiary.md" },
      { "Norse & Celtic" = "awesome/bestiary/norse-celtic.bestiary.md" },
      { "Spain & Iberian" = "awesome/bestiary/espana.bestiary.md" },
      { "Latin America" = "awesome/bestiary/latinoamerica.bestiary.md" },
      { "Yokai (Japan)" = "awesome/bestiary/yokai.bestiary.md" },
    ]},
    { "Literary & Gothic" = [
      { "Gothic Horror" = "awesome/bestiary/gothic.bestiary.md" },
      { "Lovecraftian" = "awesome/bestiary/lovecraftian.bestiary.md" },
    ]},
    { "Cinema & Pop Culture" = [
      { "Sci-Fi & Modern" = "awesome/bestiary/scifi-modern.bestiary.md" },
      { "Horror Cinema" = "awesome/bestiary/cinema.bestiary.md" },
      { "Anime & Manga" = "awesome/bestiary/anime.bestiary.md" },
    ]},
    { "Gaming" = [
      { "Dungeons & Dragons" = "awesome/bestiary/dnd.bestiary.md" },
      { "Pokemon" = "awesome/bestiary/pokemon.bestiary.md" },
      { "Digimon" = "awesome/bestiary/digimon.bestiary.md" },
    ]},
  ]},
]

extra_css = [
  "resources/css/images.css",
  "resources/css/snape.css",
]

[validation]
invalid_links = true
invalid_link_anchors = true

[theme]
variant = "modern"
custom_dir = "overrides"
logo = "resources/img/logo.png"
favicon = "resources/img/favicon.png"
language = "en"
features = [
  "navigation.sections",
  "navigation.expand",
  "navigation.breadcrumbs",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.top",
  "navigation.indexes",
  "navigation.footer",
  "navigation.path",
  "search.suggest",
  "search.highlight",
  "content.tabs.link",
  "content.code.copy",
  "content.code.select",
  "content.code.annotate",
  "content.tooltips",
  "navigation.prune",
  "content.footnote.tooltips",
  "toc.follow",
  "header.autohide",
  "announce.dismiss",
]

[[theme.palette]]
media = "(prefers-color-scheme)"
[theme.palette.toggle]
icon = "lucide/sun-moon"
name = "Switch to system preference"

[[theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue-grey"
accent = "green"
[theme.palette.toggle]
icon = "lucide/sun"
name = "Switch to dark mode"

[[theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "green"
accent = "light-green"
[theme.palette.toggle]
icon = "lucide/moon"
name = "Switch to light mode"

[theme.icon]
repo = "simple/github"

[theme.icon.admonition]
note = "lucide/info"
abstract = "lucide/list-check"
info = "lucide/info"
tip = "lucide/lightbulb"
success = "lucide/circle-check"
question = "lucide/circle-help"
warning = "lucide/alert-triangle"
failure = "lucide/x-circle"
danger = "lucide/skull"
bug = "lucide/bug"
example = "lucide/flask-conical"
quote = "lucide/text-quote"

[theme.icon.tag]
default = "lucide/hash"
cloud = "lucide/cloud"
container = "lucide/container"
tool = "lucide/wrench"
language = "lucide/code-2"

[extra.tags]
cloud = "cloud"
container = "container"
tool = "tool"
language = "language"

[[extra.social]]
icon = "simple/github"
link = "https://github.com/cosckoya"

[[extra.social]]
icon = "simple/gitlab"
link = "https://gitlab.com/cosckoya"

[[extra.social]]
icon = "simple/x"
link = "https://twitter.com/cosckoya"

[[extra.social]]
icon = "simple/devdotto"
link = "https://dev.to/cosckoya"

[[extra.social]]
icon = "material/linkedin"
link = "https://www.linkedin.com/in/javier-coscolla-cabrera-95948224"

[[extra.social]]
icon = "simple/docker"
link = "https://hub.docker.com/u/cosckoya"

# --- Markdown Extensions ---

[markdown_extensions]
toc = { permalink = true }
admonition = {}
"attr_list" = {}
"md_in_html" = {}
"def_list" = {}
"abbr" = {}
"footnotes" = {}

[markdown_extensions.pymdownx]
details = {}
superfences = { custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]}
tabbed = { alternate_style = true }
highlight = { use_pygments = true, anchor_linenums = true, line_spans = "__span" }
inlinehilite = {}
snippets = {}
magiclink = {}
mark = {}
caret = {}
tilde = {}
keys = {}
tasklist = { custom_checkbox = true }

[markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[plugins]
glightbox = {}
macros = {}
